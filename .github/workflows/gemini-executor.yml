name: Gemini Specialist Executor

on:
  workflow_dispatch:
    inputs:
      task_path:
        description: Optional worker-control task path; blank means oldest pending task
        required: false
        default: ''
  schedule:
    - cron: '5,20,35,55 * * * *'

permissions:
  contents: write

concurrency:
  group: anata-gemini-executor
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout executor infrastructure
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Checkout Specialist work branch
        uses: actions/checkout@v4
        with:
          ref: anata-local-hardening
          path: work
          fetch-depth: 0
          persist-credentials: true

      - name: Checkout worker control queue
        uses: actions/checkout@v4
        with:
          ref: worker-control
          path: control
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deterministic test runner
        run: python -m pip install --disable-pip-version-check pytest

      - name: Execute one queued Specialist task
        id: executor
        env:
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_API_KEY_01: ${{ secrets.GEMINI_API_KEY_01 }}
          GEMINI_API_KEY_02: ${{ secrets.GEMINI_API_KEY_02 }}
          GEMINI_API_KEY_03: ${{ secrets.GEMINI_API_KEY_03 }}
          GEMINI_API_KEY_04: ${{ secrets.GEMINI_API_KEY_04 }}
          GEMINI_API_KEY_05: ${{ secrets.GEMINI_API_KEY_05 }}
          GEMINI_API_KEY_06: ${{ secrets.GEMINI_API_KEY_06 }}
          GEMINI_API_KEY_07: ${{ secrets.GEMINI_API_KEY_07 }}
          GEMINI_API_KEY_08: ${{ secrets.GEMINI_API_KEY_08 }}
          GEMINI_API_KEY_09: ${{ secrets.GEMINI_API_KEY_09 }}
          GEMINI_API_KEY_10: ${{ secrets.GEMINI_API_KEY_10 }}
          TASK_PATH: ${{ github.event.inputs.task_path }}
        run: |
          MODEL="${GEMINI_MODEL:-gemini-3.5-flash-lite}"
          python automation/gemini_executor.py \
            --repo work \
            --control-dir control \
            --task-path "${TASK_PATH:-}" \
            --model "$MODEL"

      - name: Summary
        if: always()
        run: |
          echo '### Gemini Specialist Executor' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '- Target branch: `anata-local-hardening`' >> "$GITHUB_STEP_SUMMARY"
          echo '- Queue branch: `worker-control`' >> "$GITHUB_STEP_SUMMARY"
          echo '- Model: `${{ vars.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}`' >> "$GITHUB_STEP_SUMMARY"
          echo '- Code push: `${{ steps.executor.outputs.pushed || 'false' }}`' >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${{ steps.executor.outputs.commit_sha }}" ]; then
            echo '- Commit: `${{ steps.executor.outputs.commit_sha }}`' >> "$GITHUB_STEP_SUMMARY"
          fi
